name: sync from izukuuuu

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write
  workflows: write

concurrency:
  group: sync-from-izukuuuu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirror
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge updates from source repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add source https://github.com/nateafish/trending-in-one.git || git remote set-url source https://github.com/nateafish/trending-in-one.git
          git fetch source main
          git merge --no-edit -X theirs source/main
          git push origin main
