name: scheduled update and sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Deno
        if: github.repository == 'nateafish/trending-in-one'
        uses: denoland/setup-deno@v2

      - name: Update trending data
        if: github.repository == 'nateafish/trending-in-one'
        run: |
          deno task start
          deno fmt

      - name: Commit updates
        if: github.repository == 'nateafish/trending-in-one'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "update by github action"
          git push origin main

      - name: Sync from personal fork
        if: github.repository == 'BNU-CCR/trending-in-one'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add personal https://github.com/nateafish/trending-in-one.git
          git fetch personal main
          if git merge-base --is-ancestor personal/main HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit -X theirs personal/main
          git push origin main
