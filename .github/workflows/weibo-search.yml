name: weibo-search update

on:
  workflow_dispatch:
  schedule:
    - cron: "22 * * * *"

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'nateafish/trending-in-one'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Deno
        uses: denoland/setup-deno@v2

      - name: Update weibo-search data
        run: |
          deno task weibo
          deno fmt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "update weibo-search by github action"
          for i in 1 2 3 4 5; do
            if git push origin main 2>/dev/null; then
              echo "Pushed."
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $i/5)..."
            sleep 3
            git fetch origin main
            git rebase origin/main || exit 1
          done
          echo "Failed to push after 5 attempts."
          exit 1
